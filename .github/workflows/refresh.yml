name: Refresh ICS subscription

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gakumas-calendar-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify calendar conversion
        run: python -m unittest discover -s tests
      - name: Fetch public schedules and generate ICS
        run: python -u update_calendar.py --months 18 --output calendar.ics
      - name: Split fresh calendar by voice actor
        run: python split_casts.py --input calendar.ics --output-dir casts
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp calendar.ics index.html _site/
          cp -r casts _site/casts
          touch _site/.nojekyll
      - name: Save refreshed source and cast history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics casts/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh calendars and voice actor feeds"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public calendars
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish calendars
        id: deployment
        uses: actions/deploy-pages@v4
